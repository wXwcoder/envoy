# 自定义构建 workflow：在 v1.39.1 release 分支上构建 Envoy 并运行 header_routing 单测。
# 使用与 Envoy v1.39.0 相同的官方构建镜像（.github/config.yml 中 pin 的 sha）。
name: Envoy Build v1.39.1

on:
  push:
    branches: [v1.39.1]
    tags: ["v1.39.1"]
  workflow_dispatch:

# tag push 时需要创建 Release 并上传二进制资产，因此需要 contents: write。
permissions:
  contents: write

# 同一分支上的新 push 自动取消进行中的 run，避免并行浪费。
concurrency:
  group: envoy-build-v1391-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/envoyproxy/envoy-build@sha256:0b285a2c5e8fd85db238a6159f9748dac38569f081501bd508876076fecc3fe5
      # 构建容器默认用户可能无写权限，统一以 root 运行，避免 workspace/bazel 权限问题。
      options: --user root
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tag 触发时 checkout 对应 tag，否则 checkout v1.39.1 分支。
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.39.1' }}

      # 容器内 workspace 属主与 git/bazel 进程用户不一致会触发 "dubious ownership"，
      # 显式声明安全目录，否则 bazel 的 workspace status 步骤会失败。
      - name: Fix git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # 用 GitHub Actions 缓存持久化 bazel 磁盘缓存，避免每次 run 全量重编译。
      - name: Cache bazel disk cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/bazel-disk
          key: envoy-bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            envoy-bazel-disk-${{ runner.os }}-
          # 即使后续步骤失败/超时也保存缓存，避免每次全量重编译。
          save-always: true

      - name: Configure bazel disk cache
        run: |
          mkdir -p /root/.cache/bazel-disk
          echo "common --disk_cache=/root/.cache/bazel-disk" > /root/.bazelrc

      - name: Run header_routing unit tests
        run: |
          bazel test --config=clang -c dbg \
            //test/common/header_routing/... \
            //test/extensions/filters/network/header_routing/... \
            //test/extensions/filters/udp/udp_proxy/session_filters/header_routing/...

      - name: Build envoy binary
        run: |
          # fastbuild 替代 opt：免费 2 核 runner 上 opt 全量编译约 5 小时会超时，
          # fastbuild 约 2 小时可完成，功能完整，仅性能略低于 opt。
          bazel build --config=clang -c fastbuild //source/exe:envoy-static

      - name: Verify envoy binary
        run: |
          bazel-bin/source/exe/envoy-static --version

      # 仅在 tag push（v1.39.1）时创建 Release 并上传 envoy-static 二进制。
      - name: Create Release and upload envoy binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bazel-bin/source/exe/envoy-static
          generate_release_notes: true
