syntax = "proto3";

package envoy.extensions.filters.udp.udp_proxy.session.header_routing.v3;

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.filters.udp.udp_proxy.session.header_routing.v3";
option java_outer_classname = "HeaderRoutingProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/filters/udp/udp_proxy/session/header_routing/v3;header_routingv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: Header routing]
// Configuration for the header_routing UDP session filter.
//
// This filter parses a fixed 8-byte header at the beginning of each UDP datagram
// (``[Magic 1B][Version 1B][RoomIP 4B][RoomPort 2B big-endian]``), strips the header and routes
// the remaining payload to the room server encoded in the header. It must be placed before the
// :ref:`dynamic forward proxy session filter
// <envoy_v3_api_msg_extensions.filters.udp.udp_proxy.session.dynamic_forward_proxy.v3.FilterConfig>`,
// which reads the ``envoy.upstream.dynamic_host`` / ``envoy.upstream.dynamic_port`` filter state
// written by this filter.
// [#extension: envoy.filters.udp.session.header_routing]
message HeaderRouting {
  // The magic byte used to guard against misdetection of the header.
  // Defaults to 0x55 if not set.
  optional uint32 magic = 1;

  // The protocol version byte.
  // Defaults to 1 if not set.
  optional uint32 version = 2;
}
